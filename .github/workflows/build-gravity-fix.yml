name: Build Gravity API Conflict Fix

on:
  push:
    paths:
      - 'gravity-api-conflict-fix/**'
  pull_request:
    paths:
      - 'gravity-api-conflict-fix/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.1.1
        build-root-directory: gravity-api-conflict-fix
        arguments: build

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: gravity-api-conflict-fix
        path: gravity-api-conflict-fix/build/libs/*.jar
        if-no-files-found: error
