name: Build Gravity API Conflict Fix

on:
  push:
    paths:
      - 'gravity-api-conflict-fix/**'
      - '.github/workflows/build-gravity-fix.yml'
  pull_request:
    paths:
      - 'gravity-api-conflict-fix/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download and setup Gradle 8.1.1
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.1.1-bin.zip
        unzip -q gradle-8.1.1-bin.zip
        echo "$PWD/gradle-8.1.1/bin" >> $GITHUB_PATH

    - name: Verify Gradle version
      run: gradle --version

    - name: Build with Gradle
      working-directory: gravity-api-conflict-fix
      run: gradle build

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: gravity-api-conflict-fix
        path: gravity-api-conflict-fix/build/libs/*.jar
        if-no-files-found: error
